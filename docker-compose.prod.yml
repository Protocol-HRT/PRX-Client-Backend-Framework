name: prx-backend-prod

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    image: prx-backend-app:latest
    restart: unless-stopped
    working_dir: /var/www/html
    env_file: .env.prod
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - prx
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\",9000,$$errno,$$errstr,2) ? 0 : 1);'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    restart: unless-stopped
    entrypoint: ["/docker-entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/nginx:/etc/nginx/conf.d:ro
      - ./docker/nginx-entrypoint.sh:/docker-entrypoint.sh:ro
      - ./:/var/www/html:ro
      - app-storage:/var/www/html/storage/app:ro
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - prx

  certbot:
    image: certbot/certbot:latest
    env_file: .env.prod
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/certbot-renew.sh:/certbot-renew.sh:ro
      - ./docker/nginx/init-letsencrypt.sh:/init-letsencrypt.sh:ro
    # Renew every 12h; the deploy-hook script reloads nginx via Docker socket.
    # For first-time issuance, override the entrypoint:
    #   docker compose run --rm --entrypoint /init-letsencrypt.sh certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do /certbot-renew.sh; sleep 12h & wait $${!}; done'"

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-prx_backend}
      MYSQL_USER: ${DB_USERNAME:-prx}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.prod}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env.prod}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - prx
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.prod}"]
    volumes:
      - redis-data:/data
    networks:
      - prx

  horizon:
    image: prx-backend-app:latest
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["su-exec", "www-data", "php", "artisan", "horizon"]
    env_file: .env.prod
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - prx

  scheduler:
    image: prx-backend-app:latest
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["su-exec", "www-data", "php", "artisan", "schedule:work"]
    env_file: .env.prod
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - prx

  # Uncomment when you adopt Reverb for live broadcasting:
  # reverb:
  #   image: prx-backend-app:latest
  #   restart: unless-stopped
  #   command: ["php", "artisan", "reverb:start", "--host=0.0.0.0"]
  #   env_file: .env.prod
  #   environment:
  #     APP_ENV: production
  #     DB_HOST: mysql
  #     REDIS_HOST: redis
  #   ports:
  #     - "${REVERB_PORT:-8081}:8081"
  #   networks:
  #     - prx

volumes:
  mysql-data:
  redis-data:
  certbot-certs:
  certbot-webroot:

networks:
  prx:
    driver: bridge