name: prx-backend-prod

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    image: prx-backend-app:latest
    restart: unless-stopped
    working_dir: /var/www/html
    env_file: .env.prod
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    volumes:
      - app-storage:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - prx
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\",9000,$$errno,$$errstr,2) ? 0 : 1);'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx:/etc/nginx/conf.d:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - prx

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-prx_backend}
      MYSQL_USER: ${DB_USERNAME:-prx}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.prod}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env.prod}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - prx
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.prod}"]
    volumes:
      - redis-data:/data
    networks:
      - prx

  horizon:
    image: prx-backend-app:latest
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "horizon"]
    env_file: .env.prod
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - prx

  scheduler:
    image: prx-backend-app:latest
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    env_file: .env.prod
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - prx

  # Uncomment when you adopt Reverb for live broadcasting:
  # reverb:
  #   image: prx-backend-app:latest
  #   restart: unless-stopped
  #   command: ["php", "artisan", "reverb:start", "--host=0.0.0.0"]
  #   env_file: .env.prod
  #   environment:
  #     APP_ENV: production
  #     DB_HOST: mysql
  #     REDIS_HOST: redis
  #   ports:
  #     - "${REVERB_PORT:-8081}:8081"
  #   networks:
  #     - prx

volumes:
  app-storage:
  mysql-data:
  redis-data:

networks:
  prx:
    driver: bridge