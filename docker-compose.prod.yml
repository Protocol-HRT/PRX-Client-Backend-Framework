name: prx-backend-prod

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    image: prx-backend-app:latest
    restart: unless-stopped
    working_dir: /var/www/html
    env_file: .env.prod
    environment:
      SERVER_NAME: ${SERVER_NAME:-:80}
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - prx
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/up || php -r 'exit(0);'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-prx_backend}
      MYSQL_USER: ${DB_USERNAME:-prx}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.prod}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env.prod}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - prx
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.prod}"]
    volumes:
      - redis-data:/data
    networks:
      - prx

  horizon:
    image: prx-backend-app:latest
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["su-exec", "www-data", "php", "artisan", "horizon"]
    env_file: .env.prod
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - prx

  scheduler:
    image: prx-backend-app:latest
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["su-exec", "www-data", "php", "artisan", "schedule:work"]
    env_file: .env.prod
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - prx

volumes:
  mysql-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  prx:
    driver: bridge
