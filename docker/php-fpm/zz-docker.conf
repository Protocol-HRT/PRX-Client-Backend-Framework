; Production php-fpm pool tuning + healthcheck ping endpoint.
; clear_env = no keeps the compose env vars available to the pool workers,
; which is how Laravel receives APP_KEY, DB_*, etc. instead of a .env file.
[www]
clear_env = no

pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

ping.path = /ping
ping.response = pong

access.log = /proc/self/fd/2