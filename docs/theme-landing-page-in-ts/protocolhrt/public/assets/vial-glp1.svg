<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background & Lighting Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1A1A" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </radialGradient>
    
    <radialGradient id="baseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#C9A84C" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="50%" stop-color="#0A0A0A" stop-opacity="0" />
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0.8" />
    </radialGradient>

    <!-- Material Gradients -->
    <linearGradient id="amberGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A0800" />
      <stop offset="8%" stop-color="#5C2600" />
      <stop offset="25%" stop-color="#B85E00" />
      <stop offset="50%" stop-color="#E88D30" />
      <stop offset="75%" stop-color="#B85E00" />
      <stop offset="92%" stop-color="#4A1C00" />
      <stop offset="100%" stop-color="#1A0800" />
    </linearGradient>

    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2A0F00" stop-opacity="0.9" />
      <stop offset="15%" stop-color="#8A3F00" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#C86000" stop-opacity="0.7" />
      <stop offset="85%" stop-color="#8A3F00" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2A0F00" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5A3D08" />
      <stop offset="15%" stop-color="#B88A30" />
      <stop offset="30%" stop-color="#FDE08B" />
      <stop offset="50%" stop-color="#C9A84C" />
      <stop offset="75%" stop-color="#8A651B" />
      <stop offset="90%" stop-color="#E8C875" />
      <stop offset="100%" stop-color="#3A2705" />
    </linearGradient>

    <linearGradient id="capTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE08B" />
      <stop offset="50%" stop-color="#C9A84C" />
      <stop offset="100%" stop-color="#6A4C10" />
    </linearGradient>

    <linearGradient id="labelShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C0C0C0" />
      <stop offset="12%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="88%" stop-color="#F0F0F0" />
      <stop offset="100%" stop-color="#A0A0A0" />
    </linearGradient>

    <linearGradient id="glassShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="6%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="12%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="92%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="blurShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" />
    </filter>
    
    <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" />
    </filter>

    <filter id="labelDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Reusable Paths -->
    <!-- Text arc perfectly matching the label's 3D curvature -->
    <path id="textArc" d="M 300, 0 A 100,25 0 0,0 500, 0" />
    
    <!-- Vial silhouette for clipping -->
    <clipPath id="vialClip">
      <path d="M 300,680 A 100,25 0 0,0 500,680 L 500,320 C 500,280 460,260 445,260 L 445,200 A 45,10 0 0,0 355,200 L 355,260 C 340,260 300,280 300,320 Z" />
    </clipPath>

    <clipPath id="capClip">
      <path d="M 345,150 L 345,210 A 55,12 0 0,0 455,210 L 455,150 Z" />
    </clipPath>
  </defs>

  <style><![CDATA[
.float {
      animation: float 6s ease-in-out infinite;
      transform-origin: 400px 400px;
    }
    .shadowPulse {
      animation: shadowPulse 6s ease-in-out infinite;
      transform-origin: 400px 680px;
    }
    .sweep {
      animation: sweep 7s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes shadowPulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(0.92); opacity: 0.5; }
    }
    @keyframes sweep {
      0%, 15% { transform: translateX(-300px) skewX(-20deg); }
      85%, 100% { transform: translateX(900px) skewX(-20deg); }
    }
    text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
]]></style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0A0A0A" />
  <circle cx="400" cy="400" r="400" fill="url(#bgGlow)" />

  <!-- Base Shadows & Glows -->
  <g class="shadowPulse">
    <!-- Wide gold glow -->
    <ellipse cx="400" cy="685" rx="180" ry="45" fill="url(#baseGlow)" filter="url(#blurGlow)" />
    <!-- Core dark shadow -->
    <ellipse cx="400" cy="685" rx="95" ry="22" fill="#000000" filter="url(#blurShadow)" opacity="0.9" />
  </g>

  <!-- Main Floating Vial Group -->
  <g class="float">
    
    <!-- 1. Amber Glass Back & Body -->
    <path d="M 300,680 A 100,25 0 0,0 500,680 L 500,320 C 500,280 460,260 445,260 L 445,200 A 45,10 0 0,0 355,200 L 355,260 C 340,260 300,280 300,320 Z" fill="url(#amberGlass)" />
    
    <!-- Inner bottom glass thickness -->
    <ellipse cx="400" cy="680" rx="100" ry="25" fill="#1A0800" opacity="0.6" />
    <ellipse cx="400" cy="675" rx="88" ry="21" fill="none" stroke="#E88D30" stroke-width="2" opacity="0.4" />

    <!-- 2. Liquid Inside -->
    <g opacity="0.85">
      <!-- Liquid Body -->
      <path d="M 302,380 A 98,24 0 0,0 498,380 L 498,674 A 98,24 0 0,1 302,674 Z" fill="url(#liquidGrad)" />
      <!-- Liquid Surface -->
      <ellipse cx="400" cy="380" rx="98" ry="24" fill="#E88D30" opacity="0.5" />
      <ellipse cx="400" cy="380" rx="90" ry="22" fill="none" stroke="#FDE08B" stroke-width="1" opacity="0.3" />
    </g>

    <!-- 3. Label -->
    <g filter="url(#labelDropShadow)">
      <!-- Label Base -->
      <path d="M 310,360 A 100,25 0 0,0 490,360 L 490,620 A 100,25 0 0,1 310,620 Z" fill="url(#labelShade)" />
      
      <!-- Thin Gold Border (Inset) -->
      <path d="M 315,365 A 95,24 0 0,0 485,365 L 485,615 A 95,24 0 0,1 315,615 Z" fill="none" stroke="url(#goldMetal)" stroke-width="1.5" opacity="0.9" />

      <!-- Label Content -->
      <!-- Hexagon Emblem -->
      <g transform="translate(0, -5)">
        <polygon points="400,391 420.8,403 420.8,427 400,439 379.2,427 379.2,403" fill="#0A0A0A" stroke="#C9A84C" stroke-width="1.5" stroke-linejoin="round" />
        <text x="400" y="423" font-weight="800" font-size="20" fill="#C9A84C" text-anchor="middle">P</text>
      </g>

      <!-- Protocol HRT -->
      <text transform="translate(0, 475)">
        <textPath href="#textArc" startOffset="50%" text-anchor="middle">
          <tspan fill="#1A1A1A" font-weight="600" font-size="26">Protocol </tspan>
          <tspan fill="#C9A84C" font-weight="800" font-style="italic" font-size="26">HRT</tspan>
        </textPath>
      </text>

      <!-- GLP-1 SEMAGLUTIDE -->
      <text transform="translate(0, 525)">
        <textPath href="#textArc" startOffset="50%" text-anchor="middle" font-weight="700" font-size="12" fill="#C9A84C" letter-spacing="4">GLP-1 SEMAGLUTIDE</textPath>
      </text>

      <!-- Subtle separator line -->
      <path d="M 360,545 A 100,25 0 0,0 440,545" fill="none" stroke="#C9A84C" stroke-width="0.5" opacity="0.4" />

      <!-- 2.4mg/mL · 3mL -->
      <text transform="translate(0, 565)">
        <textPath href="#textArc" startOffset="50%" text-anchor="middle" font-weight="600" font-size="11" fill="#888888" letter-spacing="1">2.4mg/mL · 3mL</textPath>
      </text>
    </g>

    <!-- 4. Glass Reflections & Shading (Overlays Label) -->
    <!-- Main cylindrical shine -->
    <path d="M 300,680 A 100,25 0 0,0 500,680 L 500,320 C 500,280 460,260 445,260 L 445,200 A 45,10 0 0,0 355,200 L 355,260 C 340,260 300,280 300,320 Z" fill="url(#glassShine)" pointer-events="none" />
    
    <!-- Crisp edge highlights for realism -->
    <path d="M 306,325 L 306,672" stroke="#FFFFFF" stroke-width="3" opacity="0.15" fill="none" filter="blur(1px)" stroke-linecap="round" />
    <path d="M 494,325 L 494,672" stroke="#FFFFFF" stroke-width="1.5" opacity="0.1" fill="none" filter="blur(0.5px)" stroke-linecap="round" />

    <!-- Animated Sweep Reflection -->
    <g clip-path="url(#vialClip)">
      <rect x="0" y="150" width="200" height="600" fill="url(#sweepGrad)" class="sweep" pointer-events="none" />
    </g>

    <!-- 5. Gold Crimp Cap -->
    <g>
      <!-- Cap Body -->
      <path d="M 345,150 L 345,210 A 55,12 0 0,0 455,210 L 455,150 Z" fill="url(#goldMetal)" />
      
      <!-- Crimp Ridges (Clipped to bottom of cap) -->
      <g clip-path="url(#capClip)">
        <!-- Dark indentations -->
        <ellipse cx="400" cy="210" rx="55" ry="12" fill="none" stroke="#4A3000" stroke-width="18" stroke-dasharray="3 3" opacity="0.8" />
        <!-- Bright highlights for 3D ridge effect -->
        <ellipse cx="400" cy="209" rx="55" ry="12" fill="none" stroke="#FDE08B" stroke-width="18" stroke-dasharray="3 3" opacity="0.6" />
      </g>

      <!-- Horizontal separator line above crimps -->
      <ellipse cx="400" cy="192" rx="55" ry="12" fill="none" stroke="#8A651B" stroke-width="1" opacity="0.7" />
      <ellipse cx="400" cy="191" rx="55" ry="12" fill="none" stroke="#FDE08B" stroke-width="0.5" opacity="0.5" />

      <!-- Cap Top Surface -->
      <ellipse cx="400" cy="150" rx="55" ry="12" fill="url(#capTopGrad)" />
      
      <!-- Cap Top Septum Details -->
      <ellipse cx="400" cy="150" rx="32" ry="7" fill="#E8C875" stroke="#8A651B" stroke-width="1" />
      <ellipse cx="400" cy="150" rx="24" ry="5" fill="#C9A84C" />
      <ellipse cx="400" cy="150" rx="24" ry="5" fill="none" stroke="#5A3D08" stroke-width="1" opacity="0.5" />
      
      <!-- Cap Top Highlight -->
      <ellipse cx="400" cy="149" rx="53" ry="11" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.3" />
    </g>

  </g>

  <!-- Foreground Vignette Overlay -->
  <rect width="100%" height="100%" fill="url(#vignette)" pointer-events="none" />
</svg>