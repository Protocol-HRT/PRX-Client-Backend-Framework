<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="40%" stop-color="#0A0A0A" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
    </radialGradient>

    <!-- Base Gold Glow -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#C9A84C" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Gradients -->
    <linearGradient id="backGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A0A00" />
      <stop offset="20%" stop-color="#4A2000" />
      <stop offset="50%" stop-color="#7A3500" />
      <stop offset="80%" stop-color="#4A2000" />
      <stop offset="100%" stop-color="#1A0A00" />
    </linearGradient>

    <linearGradient id="frontGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A0A00" stop-opacity="0.9" />
      <stop offset="8%" stop-color="#FFD085" stop-opacity="0.5" />
      <stop offset="15%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="25%" stop-color="#FFD085" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="75%" stop-color="#FFD085" stop-opacity="0.05" />
      <stop offset="92%" stop-color="#FFD085" stop-opacity="0.3" />
      <stop offset="97%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1A0A00" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="glassBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A0400" />
      <stop offset="15%" stop-color="#8B4513" />
      <stop offset="50%" stop-color="#D2691E" />
      <stop offset="85%" stop-color="#8B4513" />
      <stop offset="100%" stop-color="#0A0400" />
    </linearGradient>

    <!-- Liquid Gradients -->
    <linearGradient id="liquidBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A1500" />
      <stop offset="15%" stop-color="#B85E00" />
      <stop offset="50%" stop-color="#FF9D00" />
      <stop offset="85%" stop-color="#B85E00" />
      <stop offset="100%" stop-color="#3A1500" />
    </linearGradient>

    <linearGradient id="liquidTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B85E00" />
      <stop offset="20%" stop-color="#FFB347" />
      <stop offset="50%" stop-color="#FFE082" />
      <stop offset="80%" stop-color="#FFB347" />
      <stop offset="100%" stop-color="#B85E00" />
    </linearGradient>

    <!-- Label Gradients -->
    <linearGradient id="labelGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#999999" />
      <stop offset="12%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F4F4F4" />
      <stop offset="88%" stop-color="#E0E0E0" />
      <stop offset="100%" stop-color="#888888" />
    </linearGradient>

    <linearGradient id="labelReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="12%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="15%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A6300" />
      <stop offset="15%" stop-color="#FFE599" />
      <stop offset="50%" stop-color="#C9A84C" />
      <stop offset="85%" stop-color="#FFE599" />
      <stop offset="100%" stop-color="#8A6300" />
    </linearGradient>

    <!-- Cap Gradients -->
    <linearGradient id="goldCapBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4D3900" />
      <stop offset="15%" stop-color="#FFD700" />
      <stop offset="30%" stop-color="#B38F00" />
      <stop offset="50%" stop-color="#FFDF33" />
      <stop offset="70%" stop-color="#997A00" />
      <stop offset="85%" stop-color="#FFE666" />
      <stop offset="100%" stop-color="#4D3900" />
    </linearGradient>

    <radialGradient id="goldCapTop" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE666" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997A00" />
    </radialGradient>

    <!-- Filters -->
    <filter id="blur-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" />
    </filter>
    <filter id="blur-md" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style><![CDATA[
@keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes shadowPulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(0.92); opacity: 0.5; }
    }
    @keyframes drift1 {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      50% { transform: translate(-15px, -20px) rotate(180deg); }
    }
    @keyframes drift2 {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      50% { transform: translate(20px, -15px) rotate(-180deg); }
    }
    @keyframes drift3 {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      50% { transform: translate(-10px, 25px) rotate(90deg); }
    }
    .vial-group {
      animation: float 6s ease-in-out infinite;
    }
    .shadow-group {
      animation: shadowPulse 6s ease-in-out infinite;
      transform-origin: 400px 620px;
    }
    .particle-1 { animation: drift1 12s ease-in-out infinite; }
    .particle-2 { animation: drift2 15s ease-in-out infinite; animation-delay: -4s; }
    .particle-3 { animation: drift3 10s ease-in-out infinite; animation-delay: -7s; }
]]></style>

  <!-- Pure Black Background -->
  <rect width="100%" height="100%" fill="#0A0A0A" />

  <!-- Base Shadow & Glow (Animated) -->
  <g class="shadow-group">
    <ellipse cx="400" cy="630" rx="160" ry="35" fill="url(#goldGlow)" />
    <ellipse cx="400" cy="625" rx="95" ry="22" fill="#000000" opacity="0.9" filter="url(#blur-sm)" />
    <ellipse cx="400" cy="622" rx="70" ry="15" fill="#000000" />
  </g>

  <!-- Atmospheric Particles (Background) -->
  <g opacity="0.6">
    <circle cx="220" cy="380" r="2" fill="#C9A84C" class="particle-1" filter="url(#blur-sm)" />
    <circle cx="580" cy="250" r="1.5" fill="#FFFFFF" class="particle-2" opacity="0.5" />
    <circle cx="280" cy="550" r="2.5" fill="#C9A84C" class="particle-3" filter="url(#blur-sm)" opacity="0.4" />
    <circle cx="520" cy="580" r="1" fill="#FFE599" class="particle-1" style="animation-duration: 8s;" />
  </g>

  <!-- Main Vial Group (Animated Float) -->
  <g class="vial-group">
    
    <!-- 1. Back Glass Wall -->
    <path d="M 310,300 L 310,620 A 90,20 0 0,0 490,620 L 490,300 C 490,250 460,220 440,220 L 440,180 L 360,180 L 360,220 C 340,220 310,250 310,300 Z" fill="url(#backGlass)" />

    <!-- 2. Thick Glass Base -->
    <path d="M 310,600 L 310,620 A 90,20 0 0,0 490,620 L 490,600 A 90,20 0 0,1 310,600 Z" fill="url(#glassBase)" />
    <ellipse cx="400" cy="600" rx="90" ry="20" fill="#0A0400" opacity="0.6" />

    <!-- 3. Liquid (Amber) -->
    <!-- Liquid Body -->
    <path d="M 318,350 L 318,600 A 82,18 0 0,0 482,600 L 482,350 A 82,18 0 0,1 318,350 Z" fill="url(#liquidBody)" />
    <!-- Liquid Surface -->
    <ellipse cx="400" cy="350" rx="82" ry="18" fill="url(#liquidTop)" />
    <!-- Liquid Meniscus Highlight -->
    <ellipse cx="400" cy="350" rx="80" ry="16" fill="none" stroke="#FFD085" stroke-width="1.5" opacity="0.6" />

    <!-- 4. Front Glass (Highlights & Shadows) -->
    <path d="M 310,300 L 310,620 A 90,20 0 0,0 490,620 L 490,300 C 490,250 460,220 440,220 L 440,180 L 360,180 L 360,220 C 340,220 310,250 310,300 Z" fill="url(#frontGlass)" />
    
    <!-- Inner Glass Thickness Stroke -->
    <path d="M 314,300 L 314,616 A 86,18 0 0,0 486,616 L 486,300 C 486,252 458,224 438,224 L 438,180 L 362,180 L 362,224 C 342,224 314,252 314,300 Z" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.15" />

    <!-- 5. Label -->
    <!-- Label Drop Shadow -->
    <path d="M 325,392 A 90,20 0 0,0 475,392 L 475,572 A 90,20 0 0,1 325,572 Z" fill="#000000" opacity="0.6" filter="url(#blur-sm)" />
    
    <!-- Label Base -->
    <path d="M 325,390 A 90,20 0 0,0 475,390 L 475,570 A 90,20 0 0,1 325,570 Z" fill="url(#labelGradient)" stroke="url(#goldBorder)" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Label Glossy Reflection -->
    <path d="M 325,390 A 90,20 0 0,0 475,390 L 475,570 A 90,20 0 0,1 325,570 Z" fill="url(#labelReflection)" pointer-events="none" />

    <!-- 6. Label Content -->
    <g transform="translate(0, 0)">
      <!-- Hexagon Emblem -->
      <polygon points="400,415 417.32,425 417.32,445 400,455 382.68,445 382.68,425" fill="#0A0A0A" stroke="#C9A84C" stroke-width="2" stroke-linejoin="round" />
      <text x="400" y="442" fill="#C9A84C" font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-weight="bold" font-size="20" text-anchor="middle">P</text>

      <!-- Protocol HRT -->
      <text x="400" y="485" text-anchor="middle">
        <tspan fill="#1A1A1A" font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-weight="600" font-size="24">Protocol </tspan>
        <tspan fill="#C9A84C" font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-weight="bold" font-style="italic" font-size="24">HRT</tspan>
      </text>

      <!-- TESTOSTERONE CYPIONATE -->
      <text x="400" y="525" text-anchor="middle" fill="#C9A84C" font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" letter-spacing="4">TESTOSTERONE CYPIONATE</text>

      <!-- Dosage -->
      <text x="400" y="550" text-anchor="middle" fill="#888888" font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" letter-spacing="1">200mg/mL · 10mL</text>
    </g>

    <!-- 7. Neck Cast Shadow -->
    <path d="M 360,185 L 360,210 C 380,225 420,225 440,210 L 440,185 Z" fill="#000000" opacity="0.7" filter="url(#blur-sm)" />

    <!-- 8. Gold Crimp Cap -->
    <g id="crimp-cap">
      <!-- Cap Back Inner (visible slightly at bottom edge) -->
      <ellipse cx="400" cy="185" rx="50" ry="12" fill="#2A1F00" />
      
      <!-- Cap Front Body -->
      <path d="M 350,135 A 50,12 0 0,0 450,135 L 450,185 A 50,12 0 0,1 350,185 Z" fill="url(#goldCapBody)" />
      
      <!-- Cap Top Surface -->
      <ellipse cx="400" cy="135" rx="50" ry="12" fill="url(#goldCapTop)" />
      
      <!-- Cap Top Rim Highlight -->
      <ellipse cx="400" cy="135" rx="49" ry="11" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.4" />
      
      <!-- Cap Horizontal Grooves -->
      <path d="M 350,142 A 50,12 0 0,0 450,142" fill="none" stroke="#8A6300" stroke-width="1" opacity="0.8" />
      <path d="M 350,143 A 50,12 0 0,0 450,143" fill="none" stroke="#FFE666" stroke-width="1" opacity="0.6" />
      
      <path d="M 350,165 A 50,12 0 0,0 450,165" fill="none" stroke="#8A6300" stroke-width="1.5" opacity="0.8" />
      <path d="M 350,166.5 A 50,12 0 0,0 450,166.5" fill="none" stroke="#FFE666" stroke-width="1" opacity="0.7" />

      <!-- Crimp Details (Alternating Dashes for 3D Corrugation) -->
      <!-- Dark Indents -->
      <path d="M 350,181 A 50,12 0 0,0 450,181" fill="none" stroke="#664D00" stroke-width="8" stroke-dasharray="3 3" opacity="0.7" />
      <!-- Light Ridges -->
      <path d="M 350,181 A 50,12 0 0,0 450,181" fill="none" stroke="#FFE666" stroke-width="8" stroke-dasharray="3 3" stroke-dashoffset="3" opacity="0.9" />
      
      <!-- Cap Left Highlight Reflection -->
      <path d="M 355,137 A 50,12 0 0,0 375,145 L 375,183 A 50,12 0 0,1 355,175 Z" fill="#FFFFFF" opacity="0.25" />
    </g>

  </g>

  <!-- Foreground Atmospheric Particles -->
  <g opacity="0.8">
    <circle cx="650" cy="450" r="3" fill="#FFE599" class="particle-3" filter="url(#blur-md)" opacity="0.3" />
    <circle cx="150" cy="600" r="1.5" fill="#FFFFFF" class="particle-2" style="animation-duration: 9s;" />
    <circle cx="450" cy="200" r="2" fill="#C9A84C" class="particle-1" filter="url(#blur-sm)" opacity="0.5" />
  </g>

  <!-- Global Vignette Overlay -->
  <rect width="100%" height="100%" fill="url(#vignette)" pointer-events="none" />
</svg>